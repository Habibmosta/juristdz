version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: juristdz_postgres
    environment:
      POSTGRES_DB: juristdz_db
      POSTGRES_USER: juristdz_user
      POSTGRES_PASSWORD: juristdz_password_2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - juristdz_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juristdz_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: juristdz_redis
    ports:
      - "6380:6379"
    networks:
      - juristdz_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  juristdz_network:
    driver: bridge